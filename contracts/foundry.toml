[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Local only: no fork / RPC in tests.
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

# RPC endpoints are read from env at script time by the developer; never hardcoded here.
[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[lint]
# Time-based transitions are the protocol's design (windows measured in minutes/days, not seconds).
exclude_lints = ["block-timestamp"]
# Tests and scripts use literal casts on bounded fixture values.
ignore = ["test/**/*.sol", "script/**/*.sol"]
